[package]
name = "rpg-tools"
version = "0.1.0"
edition = "2021"
description = "Development tools for the AI RPG project (map generation tester, etc.)."

[[bin]]
name = "mapgen"
path = "src/bin/mapgen.rs"

[[bin]]
name = "pack-tiles"
path = "src/bin/pack_tiles.rs"

[dependencies]
engine = { path = "../engine" }
mapgen = { path = "../mapgen" }
tiled  = { path = "../tiled" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
image = "0.25"
clap = { version = "4", features = ["derive"] }
