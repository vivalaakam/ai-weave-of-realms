[package]
name = "rpg-tools"
version = "0.1.0"
edition = "2024"
description = "Development tools for the AI RPG project (map generation tester, etc.)."

[[bin]]
name = "mapgen"
path = "src/bin/mapgen.rs"

[[bin]]
name = "pack-tiles"
path = "src/bin/pack_tiles.rs"

[dependencies]
engine = { path = "../engine" }
mapgen = { path = "../mapgen" }
tiled = { path = "../tiled" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
image = "0.25"
clap = { workspace = true }
anyhow = "1.0.102"
rand = "0.10.1"
tokenizers = "0.23.1"
hf-hub = "0.5.0"
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde = { workspace = true }

candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"