[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Core game logic: PRNG, map types, hero, combat, score. Zero Godot dependencies."

[features]
default = ["std"]
std = ["dep:sha3", "dep:serde_yaml"]

[dependencies]
sha3 = { workspace = true, optional = true }
serde = { workspace = true }
serde_yaml = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
