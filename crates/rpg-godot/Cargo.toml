[package]
name = "rpg-godot"
version = "0.1.0"
edition = "2021"
description = "GDExtension bridge between Godot 4 and rpg-engine. Only crate with Godot dependency."

[lib]
crate-type = ["cdylib"]

[dependencies]
engine = { path = "../engine" }
mapgen = { path = "../mapgen" }
tiled = { path = "../tiled" }
thiserror = { workspace = true }
tracing = { workspace = true }
godot = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
