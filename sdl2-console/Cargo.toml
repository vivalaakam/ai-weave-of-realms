[package]
name = "weave-of-realms-sdl2"
version = "0.1.0"
edition = "2021"
description = "Standalone SDL2 launcher for AI RPG using embedded-graphics."

[dependencies]
clap = { version = "4", features = ["derive"] }
embedded-graphics = "0.8.1"
rpg-embedded = { path = "../crates/rpg-embedded" }
rpg-engine = { path = "../crates/rpg-engine" }
rpg-mapgen = { path = "../crates/rpg-mapgen" }
rpg-tiled = { path = "../crates/rpg-tiled" }
sdl2 = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
