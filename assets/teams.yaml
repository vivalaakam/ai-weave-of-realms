# Team definitions for the game session.
#
# Each team entry defines:
#   - name:  display name (also the stable key used to resolve the logo at render
#            time, so names must be unique across the whole catalogue)
#   - color: hex "#RRGGBB" — team colour used for tinting heroes, cities and logos
#   - kind:  one of
#       playable — the player may choose to control this team (Human or CPU);
#                  several playable teams may be Human at once (hot-seat)
#       faction  — equivalent AI-only team, never selectable by the player
#       race     — "against everyone" non-playable team (goblins, undead, …);
#                  the number of races in a game is chosen on the setup screen
#   - logo:  exactly one of
#       tile:   <atlas index>        — sprite from the tile atlas (1_main.png)
#       bitmap: <64 hex chars>       — 256-bit / 16x16 monochrome bitmap,
#                                      row-major, bit `y*16 + x`, 1 = filled.
#                                      Rendered in the team colour.
#
# Ready-made logos live on the last atlas row (49 cols x 23 rows), columns 0-11,
# i.e. atlas indexes 22*49 + col = 1078..1089.

teams:
  # ── Playable teams (8) — logos: atlas 1078..1085 ──────────────────────────
  red:
    name: "Red"
    color: "#dc3232"
    kind: playable
    logo:
      tile: 1078

  blue:
    name: "Blue"
    color: "#3250dc"
    kind: playable
    logo:
      tile: 1079

  green:
    name: "Green"
    color: "#32b432"
    kind: playable
    logo:
      tile: 1080

  yellow:
