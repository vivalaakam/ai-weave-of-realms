# Hero class definitions.
#
# Each hero class defines:
#   - class_id: stable numeric ID (0-23)
#   - atlas_index: sprite index in the 49-column tile atlas (1_main.png)
#     Rows are: 24-31 (row 0), 73-80 (row 1), 122-129 (row 2)
#     Column formula: atlas_index = row * 49 + col_within_row
#   - name: display name
#   - hp, atk, def, spd: base stats (movement = 20 + spd)
#   - cost: gold price to hire (multiple of 5, in the 40-60 range)
#   - description: short flavour text
#
# The atlas layout distributes 8 classes per row across 3 rows:
#   - Tanks & defenders   (row 0: atlas 24-31)
#   - Fighters & attackers(row 1: atlas 73-80)
#   - Specialists & mages(row 2: atlas 122-129)

