[package]
name = "weave-of-realms-sixel"
version = "0.1.0"
edition = "2021"
description = "Standalone sixel console launcher for AI RPG using embedded-graphics."

[dependencies]
clap = { workspace = true }
crossterm = "0.28"
embedded-graphics = "0.8.1"
game = { path = "../crates/game", features = ["std", "render"] }
engine = { path = "../crates/engine" }
helpers = { path = "../crates/helpers" }
tiled = { path = "../crates/tiled" }
mapgen = { path = "../crates/mapgen" }
terminal_size = "0.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
