[package]
name = "weave-of-realms-sixel"
version = "0.1.0"
edition = "2021"
description = "Standalone sixel console launcher for AI RPG using embedded-graphics."

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
embedded-graphics = "0.8.1"
rpg-engine = { path = "../crates/rpg-engine" }
rpg-mapgen = { path = "../crates/rpg-mapgen" }
rpg-tiled = { path = "../crates/rpg-tiled" }
terminal_size = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
