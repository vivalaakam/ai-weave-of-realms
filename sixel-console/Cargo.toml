[package]
name = "weave-of-realms-sixel"
version = "0.1.0"
edition = "2021"
description = "Standalone sixel console launcher for AI RPG using embedded-graphics."

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
embedded-graphics = "0.8.1"
game = { path = "../crates/game", features = ["std"] }
terminal_size = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
